name: Profile Cards

on:
  schedule:
    - cron: "45 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: LebgaaAbderrahmane
        run: |
          gh api graphql -f query='query($login: String!) { user(login: $login) { repositories(first: 100, ownerAffiliations: [OWNER], isFork: false, orderBy: {field: PUSHED_AT, direction: DESC}) { nodes { stargazerCount languages(first: 20) { edges { size node { name color } } } } } contributionsCollection { totalCommitContributions totalPullRequestContributions totalIssueContributions contributionCalendar { weeks { contributionDays { date contributionCount } } } } repositoriesContributedTo(first: 1) { totalCount } } }' -F login="$USERNAME" > cards.json
          python3 scripts/gen_cards.py cards.json
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add cards
          git commit -m "generated profile cards" || echo "No changes to commit"
          git push
